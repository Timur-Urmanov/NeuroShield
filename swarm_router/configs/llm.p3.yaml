# P3-local config (notes/hypotheses.md, P3-local). Local CPU models via llama.cpp; external tasks from
# scripts/fetch_data.py (GSM8K 500, MBPP 500, AG News 500). PRICES ARE A COMPUTE PROXY (pseudo-USD per 1M
# tokens = parameter count in billions); cost_norm 0.001 pseudo-USD = 1 cost unit, reward = success - 0.15 * units.
# team_roles executor_only: swarm teams share value memory, one executor call (P1-local: no role strength).
run:
  budget_usd: 500.0
  lam: 0.15
  cost_norm_usd: 0.001
  max_tokens:
    planner: 512
    executor: 768
    verifier: 512
  cache_dir: .cache/llm
  log_dir: results/llm_calls
  include_seed_in_cache_key: false
  variant_budget_share: equal
  team_roles: executor_only
embeddings:
  dim: 16
  projection_seed: 12345
  provider: hashed
tasks:
  builtin: false
  external_dir: data
  code_timeout_s: 5.0
  code_mem_mb: 512
models:
- name: qwen05
  provider: llama_cpp
  model: .cache/models/qwen2.5-0.5b-instruct-q4_k_m.gguf
  price_in_per_1m: 0.5
  price_out_per_1m: 0.5
  params:
    temperature: 0.7
    n_ctx: 16384
- name: qwen15
  provider: llama_cpp
  model: .cache/models/qwen2.5-1.5b-instruct-q4_k_m.gguf
  price_in_per_1m: 1.5
  price_out_per_1m: 1.5
  params:
    temperature: 0.7
    n_ctx: 16384
- name: qwen3
  provider: llama_cpp
  model: .cache/models/qwen2.5-3b-instruct-q4_k_m.gguf
  price_in_per_1m: 3.0
  price_out_per_1m: 3.0
  params:
    temperature: 0.7
    n_ctx: 16384
