name: swarm-router regression
on:
  push:
    paths: ["swarm_router/**", ".github/workflows/swarm-regression.yml"]
  pull_request:
    paths: ["swarm_router/**", ".github/workflows/swarm-regression.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: swarm_router
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
